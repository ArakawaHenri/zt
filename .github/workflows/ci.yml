name: CI & Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Lint shell and Python overlay scripts
        if: runner.os != 'Windows'
        run: make lint

      - name: Validate install.ps1 PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors -join "`n") }

      - name: Build single-file zipapps (zt and zt.pyz)
        shell: bash
        run: |
          python tools/mkzt.py -o zt
          python tools/mkzt.py -o zt.pyz
          python -c "import pathlib; assert pathlib.Path('zt').read_bytes() == pathlib.Path('zt.pyz').read_bytes()"

      - name: Run unit tests under -W error
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
        run: python -W error -m unittest discover -s tests -v

      - name: Smoke-test standalone zipapp
        shell: bash
        run: python zt --version && python zt --help > /dev/null

  verify-container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify live Docker container invariants (accept local + accept all)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
          ZT_ENGINE: docker
          ZT_CAPS: least
        run: |
          docker info --format 'Server={{.ServerVersion}} Security={{json .SecurityOptions}}'
          echo "Host NOFILE hard limit: $(ulimit -Hn)"
          # Raise shell soft limit to hard limit (typically 1048576+) to confirm container NOFILE clamping.
          ulimit -n "$(ulimit -Hn)" 2>/dev/null || true
          python3 -m zt.verify --build --profile trustagent --accept local
          ZT_VNC_PW='ci-verify-pass-123456' python3 -m zt.verify --profile trustagent --accept all

  verify-arm64-cross:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up QEMU binfmt for cross-arch amd64 verification
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: amd64

      - name: Verify native arm64 container (19-check two-boot suite)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
          ZT_ENGINE: docker
          ZT_CAPS: least
        run: |
          python3 -m zt.verify --build --profile trustagent --accept local --arch arm64

      - name: Verify QEMU cross-arch amd64 build, ELF architecture, and overlay tools
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
          ZT_ENGINE: docker
        run: |
          # Linux qemu-user binfmt cannot translate NETLINK_NETFILTER / IPT_SO_SET_REPLACE
          # sockopts required by zt-net.service during a full systemd boot, so validate the
          # cross-arch amd64 image build, ELF target, shared libraries, and zt-identity under QEMU.
          python3 -c "from zt.build import build; from zt.engine import make_engine; e = make_engine(); e.require(); build(e, 'trustagent', arch='amd64')"
          ref="$(python3 -c "from zt.build import current_ref; print(current_ref('trustagent', 'amd64'))")"
          arch="$(docker image inspect --format '{{.Architecture}}' "$ref")"
          test "$arch" = "amd64"
          docker run --rm --platform linux/amd64 -i --entrypoint /usr/bin/python3 "$ref" - <<'PY'
          import os, pathlib, platform, struct, subprocess, tempfile

          assert platform.machine() == 'x86_64', platform.machine()
          assert os.readlink('/usr/sbin/iptables') == '/usr/local/sbin/zt-iptables'

          for path in (
              '/opt/apps/com.qianxin.trustagent/files/bin/trustdservice',
              '/opt/apps/com.qianxin.trustagent/files/bin/TrustAgent',
          ):
              hdr = pathlib.Path(path).read_bytes()[:20]
              assert hdr[:4] == b'\x7fELF', f'{path} is not ELF'
              e_machine = struct.unpack_from('<H', hdr, 18)[0]
              assert e_machine == 62, f'{path} e_machine={e_machine}, expected 62 (x86_64)'

          ldd = subprocess.run(
              ['ldd', '/opt/apps/com.qianxin.trustagent/files/bin/trustdservice'],
              capture_output=True, text=True, check=True,
          )
          assert 'not found' not in ldd.stdout, ldd.stdout

          with tempfile.TemporaryDirectory() as tmp:
              subprocess.run(
                  ['/usr/local/bin/zt-identity', '--seed', '0123456789abcdef0123456789abcdef', '--dump-dir', tmp],
                  check=True,
              )
              for rel in (
                  'dmi/tables/smbios_entry_point',
                  'dmi/tables/DMI',
                  'dmi/id/product_uuid',
                  'dmi/id/product_serial',
              ):
                  p = pathlib.Path(tmp) / rel
                  assert p.is_file() and p.stat().st_size > 0, f'missing {rel}'
          print('amd64 cross-arch build, ELF, ldd, and zt-identity OK')
          PY

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, verify-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Build release artifacts
        run: |
          python tools/mkzt.py -o zt
          python tools/mkzt.py -o zt.pyz
          sha256sum zt zt.pyz > SHA256SUMS

      - name: Generate artifact build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            zt
            zt.pyz
            SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            zt
            zt.pyz
            SHA256SUMS
