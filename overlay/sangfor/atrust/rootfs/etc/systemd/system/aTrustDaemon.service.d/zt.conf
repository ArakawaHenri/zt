# Now and then the daemon starts a tray of its own, as its service user and
# outside the session. Whatever a unit of this image starts is to have no way
# up, so the daemon gets the same word as the desktop and the session.
[Unit]
Requires=zt-net.service
After=zt-net.service

[Service]
NoNewPrivileges=true
CapabilityBoundingSet=~CAP_SYS_ADMIN CAP_SYS_CHROOT CAP_SYS_MODULE CAP_SYS_RAWIO CAP_SYS_PTRACE
