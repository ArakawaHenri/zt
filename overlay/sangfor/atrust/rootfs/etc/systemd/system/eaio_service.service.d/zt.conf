# Whatever a unit of this image starts is to have no way up: the daemon is
# root already, and dropping to another user does not need the way up.
[Unit]
Requires=zt-net.service
After=zt-net.service

[Service]
NoNewPrivileges=true
CapabilityBoundingSet=~CAP_SYS_ADMIN CAP_SYS_CHROOT CAP_SYS_MODULE CAP_SYS_RAWIO CAP_SYS_PTRACE
