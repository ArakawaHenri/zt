# Persistent login & device-trust state paths for Qianxin TrustAgent.
# Format: <volume_slot> <container_path> <owner:group> <mode>
trustagent-sys /usr/share/trustagent root:root 1777
trustagent-home /home/kasm-user/.TrustAgent kasm-user:kasm-user 0755
kasm-config /home/kasm-user/.config kasm-user:kasm-user 0755
kasm-local /home/kasm-user/.local kasm-user:kasm-user 0755
kasm-pki /home/kasm-user/.pki kasm-user:kasm-user 0755
